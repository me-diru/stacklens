[package]
name = "stacklens"
version = "0.1.0"
edition = "2021"
description = "See your whole tech stack, and the AI agents working on it, as one local graph."
license = "MIT"
repository = "https://github.com/me-diru/stacklens"
homepage = "https://github.com/me-diru/stacklens"
readme = "README.md"
keywords = ["developer-tools", "visualization", "ai-agents", "mcp", "graph"]
categories = ["command-line-utilities", "development-tools", "visualization"]
exclude = [".stacklens", "docs/*.png"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
regex = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"

[profile.release]
opt-level = 2
strip = true
